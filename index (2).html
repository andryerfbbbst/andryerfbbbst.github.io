<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>andryerfb</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, #140306 0%, #1f050c 50%, #0a0103 100%);
            background-color: #140306;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Фоновая сетка с иконками кошечек */
        #bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            grid-auto-rows: 70px;
            gap: 15px;
            padding: 10px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.85;
        }

        .bg-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.15;
            transition: opacity 0.5s ease, filter 0.5s ease;
        }

        .bg-icon svg {
            width: 42px;
            height: 42px;
            fill: none;
            stroke: #8a4a58;
            stroke-width: 1.8;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        /* Эффект гирлянды: розово-красное неоновое вспыхивание */
        .bg-icon.glow {
            animation: flickerGlow 3.5s infinite ease-in-out;
        }

        @keyframes flickerGlow {
            0%, 100% {
                opacity: 0.15;
                filter: none;
            }
            50% {
                opacity: 0.95;
                filter: drop-shadow(0 0 8px rgba(255, 75, 120, 0.9)) 
                        drop-shadow(0 0 18px rgba(255, 20, 80, 0.6));
            }
        }

        .bg-icon.glow svg {
            stroke: #ff4b78;
        }

        /* Контейнеры страниц над фоном */
        .section {
            min-height: 85vh;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }
        
        /* Розово-красный неоновый заголовок */
        h1 {
            color: #ffffff;
            font-size: 2.8rem;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-align: center;
            animation: neonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes neonGlow {
            0% {
                text-shadow: 
                    0 0 5px rgba(255, 75, 120, 0.6),
                    0 0 10px rgba(255, 20, 80, 0.4);
            }
            100% {
                text-shadow: 
                    0 0 10px rgba(255, 75, 120, 1),
                    0 0 25px rgba(255, 20, 80, 0.8),
                    0 0 45px rgba(255, 0, 60, 0.6);
            }
        }

        p.subtitle {
            color: #b5828d;
            font-size: 0.9rem;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Карточки */
        .card {
            background-color: rgba(20, 5, 10, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid #3d121c;
            border-radius: 14px;
            padding: 14px 20px;
            width: 100%;
            text-align: center;
            margin-bottom: 14px;
            text-decoration: none;
            color: #ffffff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: cardGlow 4s infinite alternate ease-in-out;
        }

        @keyframes cardGlow {
            0% {
                border-color: #3d121c;
                box-shadow: 0 0 8px rgba(255, 75, 120, 0.05);
            }
            100% {
                border-color: #7a2438;
                box-shadow: 0 0 18px rgba(255, 75, 120, 0.2);
            }
        }

        .card:hover {
            border-color: #ff4b78;
            background-color: rgba(35, 8, 18, 0.95);
            box-shadow: 0 0 25px rgba(255, 75, 120, 0.4);
            transform: translateY(-2px);
        }

        .phone-card {
            color: #ffffff;
            font-weight: 500;
        }

        .map-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 16px;
            text-align: left;
        }

        .map-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
        }

        .map-subtitle {
            color: #b5828d;
            font-size: 0.8rem;
            margin-bottom: 12px;
        }

        .map-frame {
            width: 100%;
            height: 160px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #3d121c;
            filter: grayscale(100%) invert(92%) contrast(83%) sepia(50%) hue-rotate(-50deg);
        }

        .map-frame iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .map-footer {
            width: 100%;
            text-align: center;
            color: #b5828d;
            font-size: 0.8rem;
            margin-top: 10px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .map-footer:hover {
            color: #ff4b78;
        }

        /* Анимированная стрелочка вниз */
        .scroll-down {
            margin-top: 15px;
            color: #ff4b78;
            text-decoration: none;
            font-size: 1.8rem;
            animation: bounce 2s infinite;
            display: inline-block;
            cursor: pointer;
            transition: text-shadow 0.3s ease;
        }

        .scroll-down:hover {
            text-shadow: 0 0 10px #ff4b78;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        /* Стиль для второго блока Deff */
        .deff-card {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 18px 25px;
            background: rgba(30, 8, 16, 0.9);
            border-color: #7a2438;
        }

        .deff-card span {
            color: #ff4b78;
        }

        .card-icon { width: 22px; height: 22px; flex-shrink: 0; }
        .card-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid #7a2438; }

        /* Счётчик просмотров */
        .views {
            margin-top: 6px;
            margin-bottom: 4px;
            padding: 9px 20px;
            background-color: rgba(20, 5, 10, 0.88);
            border: 1px solid #7a2438;
            border-radius: 14px;
            box-shadow: 0 0 14px rgba(255, 75, 120, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            color: #b5828d;
            font-size: 0.95rem;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }
        .views .eye { font-size: 1.1rem; }
        .views #views-count { color: #ffffff; font-weight: 600; }
    </style>

    <script>
        // SVG иконка кошечки с ушками, глазками и усиками
        const catSvg = `
        <svg viewBox="0 0 100 100">
            <!-- Ушки -->
            <path d="M 28 35 L 15 12 L 42 28" />
            <path d="M 72 35 L 85 12 L 58 28" />
            <!-- Голова -->
            <path d="M 32 30 C 25 30, 18 45, 22 62 C 26 78, 40 88, 50 88 C 60 88, 74 78, 78 62 C 82 45, 75 30, 68 30 Z" />
            <!-- Глаза -->
            <path d="M 36 48 Q 40 44 44 48" />
            <path d="M 56 48 Q 60 44 64 48" />
            <!-- Носик и ротик -->
            <path d="M 47 58 L 53 58 L 50 62 Z" />
            <!-- Усики -->
            <path d="M 35 68 L 22 66" />
            <path d="M 35 72 L 18 73" />
            <path d="M 65 68 L 78 66" />
            <path d="M 65 72 L 82 73" />
        </svg>`;

        const bgGrid = document.getElementById('bg-grid');
        
        // Вычисляем сколько элементов поместится на экран
        const cols = Math.ceil(window.innerWidth / 85);
        const rows = Math.ceil(window.innerHeight / 85);
        const totalIcons = cols * rows;

        for (let i = 0; i < totalIcons; i++) {
            const iconDiv = document.createElement('div');
            iconDiv.className = 'bg-icon';
            iconDiv.innerHTML = catSvg;

            // Случайным образом назначаем загорающиеся иконки (как гирлянда)
            if (Math.random() > 0.45) {
                iconDiv.classList.add('glow');
                // Рандомная задержка анимации
                const delay = (Math.random() * 5).toFixed(2);
                const duration = (2.5 + Math.random() * 2.5).toFixed(2);
                iconDiv.style.animationDelay = `${delay}s`;
                iconDiv.style.animationDuration = `${duration}s`;
            }

            bgGrid.appendChild(iconDiv);
        }

        // Счётчик просмотров: реальный общий счётчик + стартовое значение
        (function () {
            const START = 1340; // при первом заходе покажет 1.341
            const el = document.getElementById('views-count');
            const fmt = n => n.toLocaleString('de-DE'); // 1.341

            function show(n) {
                // плавный рост цифры до итогового значения
                const from = Math.max(START, n - 15);
                const t0 = performance.now();
                const dur = 1200;
                function tick(t) {
                    const k = Math.min(1, (t - t0) / dur);
                    el.textContent = fmt(Math.round(from + (n - from) * k));
                    if (k < 1) requestAnimationFrame(tick);
                }
                requestAnimationFrame(tick);
            }

            function get(url, pick) {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 6000);
                return fetch(url, { signal: ctrl.signal })
                    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                    .then(j => { clearTimeout(timer); const v = Number(pick(j)); if (!v) throw new Error('bad'); return v; });
            }

            // 1-й сервис, если не ответит, пробуем 2-й
            get('https://api.counterapi.dev/v1/andryerfbbbst-github-io/visits/up', j => j.count)
                .catch(() => get('https://abacus.jasoncameron.dev/hit/andryerfbbbst-github-io/visits', j => j.value))
                .then(c => show(START + c))
                .catch(() => { el.textContent = fmt(START + 1); });
        })();
    </script>
